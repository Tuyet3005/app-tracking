<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>🌼 Login - IELTS Orange Tracking</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial;
        background: linear-gradient(180deg, #fbfdff 0%, #f2f6fb 100%);
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0f172a;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 40px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(250, 252, 255, 0.98) 100%
        );
        backdrop-filter: blur(10px);
        border-radius: 24px;
        box-shadow:
          0 20px 60px rgba(15, 23, 42, 0.12),
          0 8px 24px rgba(2, 6, 23, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.08);
        animation: slide-up 0.5s ease-out;
      }

      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-title {
        font-size: 2rem;
        font-weight: 800;
        background: linear-gradient(
          135deg,
          #ff6b9d 0%,
          #ffa500 50%,
          #ffd700 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }

      .login-subtitle {
        font-size: 0.95rem;
        color: #64748b;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        color: #334155;
        margin-bottom: 8px;
        letter-spacing: 0.3px;
      }

      .form-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        border: 2px solid rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.99);
        color: #0f172a;
        transition: all 200ms;
        font-family: inherit;
      }

      .form-input:focus {
        outline: none;
        border-color: rgba(99, 102, 241, 0.35);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        background: #ffffff;
      }

      .input-with-icon {
        position: relative;
      }
      .show-pass-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 1.05rem;
        padding: 6px;
        border-radius: 8px;
        transition: background 150ms;
        color: #475569;
      }
      .show-pass-btn:hover {
        background: rgba(15, 23, 42, 0.03);
      }

      .login-button {
        width: 100%;
        padding: 14px 24px;
        font-size: 1.05rem;
        font-weight: 800;
        color: #ffffff;
        background: linear-gradient(
          135deg,
          #ff6b9d 0%,
          #ffa500 50%,
          #ffd700 100%
        );
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 250ms;
        box-shadow:
          0 8px 24px rgba(255, 107, 157, 0.3),
          0 2px 8px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-top: 8px;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 12px 32px rgba(255, 107, 157, 0.4),
          0 4px 12px rgba(0, 0, 0, 0.12);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        margin-top: 16px;
        padding: 12px 16px;
        background: linear-gradient(
          135deg,
          rgba(239, 68, 68, 0.08) 0%,
          rgba(239, 68, 68, 0.05) 100%
        );
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 10px;
        color: #dc2626;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
        animation: shake 0.4s ease-out;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      .success-message {
        margin-top: 16px;
        padding: 12px 16px;
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.08) 0%,
          rgba(16, 185, 129, 0.05) 100%
        );
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 10px;
        color: #059669;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      .signup-link {
        margin-top: 24px;
        text-align: center;
        font-size: 0.9rem;
        color: #64748b;
      }

      .signup-link a {
        color: #ff6b9d;
        font-weight: 700;
        text-decoration: none;
        transition: color 200ms;
      }

      .signup-link a:hover {
        color: #ffa500;
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 32px 24px;
          margin: 20px;
        }

        .login-title {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1 class="login-title">🌼 Welcome Back 🌼</h1>
        <p class="login-subtitle">Sign in to continue your IELTS journey</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-with-icon">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              id="togglePassword"
              class="show-pass-btn"
              aria-pressed="false"
              title="Show password"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Sign In
        </button>
      </form>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <div class="signup-link">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const loginButton = document.getElementById("loginButton");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
        successMessage.classList.remove("show");
      }

      function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add("show");
        errorMessage.classList.remove("show");
      }

      function hideMessages() {
        errorMessage.classList.remove("show");
        successMessage.classList.remove("show");
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessages();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError("Please enter both username and password");
          return;
        }

        // Disable button during request
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok) {
            showSuccess("Login successful! Redirecting...");
            setTimeout(() => {
              window.location.href = "/";
            }, 1000);
          } else {
            showError(data.error || "Login failed. Please try again.");
            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
          }
        } catch (error) {
          console.error("Login error:", error);
          showError("An error occurred. Please try again.");
          loginButton.disabled = false;
          loginButton.textContent = "Sign In";
        }
      });

      // Clear error message when user starts typing
      usernameInput.addEventListener("input", hideMessages);
      passwordInput.addEventListener("input", hideMessages);

      // Toggle password visibility
      const togglePassword = document.getElementById("togglePassword");
      if (togglePassword) {
        togglePassword.addEventListener("click", () => {
          const t =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", t);
          const pressed = t === "text";
          togglePassword.setAttribute(
            "aria-pressed",
            pressed ? "true" : "false",
          );
          togglePassword.textContent = pressed ? "🙈" : "👁️";
          togglePassword.title = pressed ? "Hide password" : "Show password";
        });
      }
    </script>
  </body>
</html>
